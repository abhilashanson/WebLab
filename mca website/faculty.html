<html>
<head>
<title>Faculty Details</title>
<style>
  body {
  background-image: url('oip.png');
   background-repeat: no-repeat;
   background-position: center;
  }

  nav {
    background-color: #1f2937; 
    display: flex;         
    gap: 30px;                     
    padding: 10px 20px;       

  }

  nav a {
    color: #ffffff;            
    text-decoration: none;   
    font-size: 18px;         
    font-weight: 500;
    padding: 8px 12px;       
    border-radius: 4px;      
  } 


  h1 {
    color: #1f2937;
  }

  .container {
    max-width: 1000px;
    margin: 1rem auto;
    padding: 0 1.5rem;
  }

  .section-title {
    text-align: center;
    margin-bottom: 1.5rem;
    color: #1f2937;
    font-size: 2rem;
    position: relative;
  }


  .faculty-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
  }
  
  .faculty-card {
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
  }

  .faculty-img-container {
    width: 100%;
    height: 200px;
    overflow: hidden;
    background-color: #e2e8f0;
    position: relative;
  }

  .faculty-img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }

  .faculty-info {
    padding: 1.5rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .faculty-name {
    font-size: 1.25rem;
    color:#1f2937;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }

  .faculty-designation {
    font-size: 0.95rem;
    color: #3b82f6;
    font-weight: 500;
    margin-bottom: 0.8rem;
  }
</style>
</head>
